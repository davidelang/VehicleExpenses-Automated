# VehicleExpenses walk for ./capture-manual-screenshots.
# David runs a capture. An agent may run --check. No device is required for that.
# This file stays in this app. It is not a build-examples file.
# No hooks key: the walk is primitives. A hook would be an audit item
# (missing primitive, lazy config, or a real one-app exception).
# scripts/capture-i18n-manual-screenshots.py stays. This config does not replace that file.

package: com.davidlang.vehicleexpensesautomated
activity: com.davidlang.vehicleexpensesautomated/.MainActivity

forms:
  phone_max_inches: 8
  gap_inches: 1.5

ignore_text: ["1x", "2x", "4x"]

# English literals the geometry must not treat as the shutter or the pump control.
# System gallery labels below are device-language words, not string ids.

never_tap:
  - settings_sync_now_all_configured
  - settings_sync_now_this_destination
  - settings_sync
  - settings_keep_local_and_write_it_back
  - settings_keep_local_and_leave_the_sheet
  - settings_accept_remote_field_cleared
  - settings_enable_background_sync
  - settings_enable_background_backup
  - settings_save_fill_and_trip_photos
  - fuel_save
  - vehicle_save_changes
  - help_create_vehicle
  - settings_clear
  - settings_clear_debug_data
  - settings_fill_sessions
  - vehicle_show_all_vehicles
  - vehicle_clear_odo
  - vehicle_run_discovery
  - vehicle_gallery
  - vehicle_camera

never_tap_prefix: ["Sync now"]

output:
  en: docs/user-manual/images/{form}
  other: docs/i18n/{segment}/images/{form}

endonym_key: "lang_name_{pref}"
endonym_row:
  en-001: 1

drawer:
  open: nav_menu
  labels:
    - nav_fill
    - nav_manage_vehicles
    - nav_new_expense
    - nav_reports
    - nav_start_trip
    - nav_syncing
    - nav_settings
    - nav_help
    - nav_about
  open_if_text: [nav_settings, nav_help]
  # Some packs translate these two to the same text. The drawer row is Syncing.
  unblock_when_same: [nav_syncing, settings_sync]

language:
  menu: nav_menu
  settings: nav_settings
  field: settings_language
  system: settings_language_system
  ready: nav_menu

launch:
  sleep: 2.5
  dismiss: [onboarding_skip_for_now]

