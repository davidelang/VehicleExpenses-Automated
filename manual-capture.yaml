sections:
  - group: drawer
    shots: [01-drawer.jpg]
    steps:
      - open_drawer: true
      - shot: 01-drawer.jpg
      - close_drawer: true
        on_fail: stop
        note: "drawer scrim was not tapped after the drawer shot"

  - group: vehicles
    shots:
      - r1-manage-vehicles-crops.jpg
      - 03b-manage-vehicles-new.jpg
      - r2-manage-vehicles-landmarks.jpg
    steps:
      - block:
          shots: [r1-manage-vehicles-crops.jpg, 03b-manage-vehicles-new.jpg]
          steps:
            - drawer: nav_manage_vehicles
            - shot: r1-manage-vehicles-crops.jpg
            - block:
                shots: [03b-manage-vehicles-new.jpg]
                steps:
                  - tap_field: fuel_vehicle
                  - wait: 0.4
                  - tap_text: vehicle_add_new_vehicle
                  - wait: 0.6
                  - shot: 03b-manage-vehicles-new.jpg
                  - back: 1
      - block:
          shots: [r2-manage-vehicles-landmarks.jpg]
          steps:
            - drawer: nav_manage_vehicles
            - tap_text:
                id: vehicle_show_landmarks
                scroll: page
              note: "Show Landmarks not found; captured Manage Vehicles"
              note_shots: [r2-manage-vehicles-landmarks.jpg]
            - wait: 0.6
            - shot: r2-manage-vehicles-landmarks.jpg
            - back: 1

  - group: fill
    shots:
      - r3-fill-odo-live.jpg
      - r3b-fill-vehicle-not-identified.jpg
      - r4-fill-odo-result.jpg
      - r5-fill-pump-result.jpg
    steps:
      - drawer: nav_fill
      - shot: r3-fill-odo-live.jpg
      - block:
          shots: [r3b-fill-vehicle-not-identified.jpg]
          on_fail: leave
          steps:
            - push_if_absent:
                remote: /sdcard/DCIM/Camera/not-a-dash.jpg
            - tap_desc: fill_pick_an_existing_image
            - wait: 1.0
            - tap_any:
                text: [Photos, Camera]
                scroll: page
            - wait: 0.8
            - tap_matching:
                contains: "Photo taken on"
            - wait_until:
                dialog: vehicle_vehicle_not_identified
                show_all: vehicle_show_all_vehicles
                timeout: 25
            - shot: r3b-fill-vehicle-not-identified.jpg
              on_fail: note
            - back_while_dialog:
                dialog: vehicle_vehicle_not_identified
                show_all: vehicle_show_all_vehicles
      - block:
          shots: [r4-fill-odo-result.jpg, r5-fill-pump-result.jpg]
          steps:
            - tap_between:
                desc: [fuel_save, fill_pick_an_existing_image]
              on_fail: skip
            - wait_settle:
                kind: fill
                processing: ui_cancel_processing
                retry: settings_retry
                dialog: vehicle_vehicle_not_identified
                show_all: vehicle_show_all_vehicles
                between: [fuel_save, fill_pick_an_existing_image]
                timeout: 20
            - back_while_dialog:
                dialog: vehicle_vehicle_not_identified
                show_all: vehicle_show_all_vehicles
            - shot:
                file: r4-fill-odo-result.jpg
                unless:
                  - fill_photo_save_failed_entry_will_have_no_photo
                  - vehicle_vehicle_not_identified
            - block:
                shots: [r5-fill-pump-result.jpg]
                steps:
                  - tap_beside:
                      save: fuel_save
                      pick: fill_pick_an_existing_image
                      skip: [settings_retry, ui_cancel_processing, nav_start_trip]
                    on_fail: note
                    note: "pump mode control not found; captured current Fill"
                    note_shots: [r5-fill-pump-result.jpg]
                  - wait: 0.6
                  - shot:
                      file: r5-fill-pump-result.jpg
                      unless:
                        - fill_photo_save_failed_entry_will_have_no_photo
                        - vehicle_vehicle_not_identified

  - group: expense
    shots: [r6-new-expense.jpg]
    steps:
      - drawer: nav_new_expense
      - shot: r6-new-expense.jpg
      - back: 1

  - group: reports
    shots:
      - 06-reports.jpg
      - 05-expense-list.jpg
      - expense-edit.jpg
      - time-based-reports.jpg
      - time-based-reports-scrolled.jpg
      - fill-history.jpg
      - fuel-edit.jpg
      - trip-miles.jpg
    steps:
      - block:
          shots: [06-reports.jpg, 05-expense-list.jpg, expense-edit.jpg]
          steps:
            - drawer: nav_reports
            - shot: 06-reports.jpg
            - block:
                shots: [05-expense-list.jpg, expense-edit.jpg]
                steps:
                  - tap_text:
                      id: reports_expenses_list
                      else: [nav_expense_list]
                      scroll: page
                  - wait: 0.6
                  - shot: 05-expense-list.jpg
                  - block:
                      shots: [expense-edit.jpg]
                      steps:
                        - tap_matching:
                            card: true
                          on_fail: note
                          note: "no expense row; captured the list"
                          note_shots: [expense-edit.jpg]
                        - wait: 0.6
                        - shot: expense-edit.jpg
            - back: 1
      - block:
          shots: [time-based-reports.jpg, time-based-reports-scrolled.jpg]
          steps:
            - drawer: nav_reports
            - tap_text:
                id: reports_time_based_reports
                scroll: page
            - wait: 0.8
            - shot: time-based-reports.jpg
            - block:
                shots: [time-based-reports-scrolled.jpg]
                steps:
                  - swipe: page
                  - shot: time-based-reports-scrolled.jpg
            - back: 1
      - block:
          shots: [fill-history.jpg, fuel-edit.jpg]
          steps:
            - drawer: nav_reports
            - tap_text:
                id: reports_fill_history
                scroll: page
            - wait: 0.6
            - shot: fill-history.jpg
            - block:
                shots: [fuel-edit.jpg]
                steps:
                  - tap_matching:
                      card: true
                      skip_format: fill_s_1_s_fills
                    on_fail: note
                    note: "no fill row; captured fill history"
                    note_shots: [fuel-edit.jpg]
                  - wait: 0.6
                  - shot: fuel-edit.jpg
            - back: 1
      - block:
          shots: [trip-miles.jpg]
          steps:
            - drawer: nav_reports
            - tap_text:
                id: reports_trip_miles
                scroll: page
            - wait: 0.6
            - shot: trip-miles.jpg
            - back: 1

  - group: trip
    shots: [start-trip.jpg]
    steps:
      - drawer: nav_start_trip
      - shot: start-trip.jpg
      - block:
          shots: []
          steps:
            - tap_between:
                desc: [nav_start_trip, trip_personal_now_at_this_location]
              on_fail: skip
              note: "shutter between Start trip and Personal now at this location not found"
              note_shots: [start-trip.jpg]
            - wait_settle:
                kind: trip
                processing: ui_cancel_processing
                retry: settings_retry
                dialog: vehicle_vehicle_not_identified
                show_all: vehicle_show_all_vehicles
                between: [nav_start_trip, trip_personal_now_at_this_location]
                timeout: 20
            - back_while_dialog:
                dialog: vehicle_vehicle_not_identified
                show_all: vehicle_show_all_vehicles
      - back: 1

  - group: sync
    shots:
      - syncing-hub.jpg
      - 08-spreadsheet-sync.jpg
      - 09-spreadsheet-provider-picker.jpg
      - 10-spreadsheet-google-form.jpg
    steps:
      - drawer: nav_syncing
      - shot: syncing-hub.jpg
      - block:
          shots:
            - 08-spreadsheet-sync.jpg
            - 09-spreadsheet-provider-picker.jpg
            - 10-spreadsheet-google-form.jpg
          steps:
            - tap_text:
                id: settings_spreadsheet_sync
                scroll: fling
              flag: card
              note: "Spreadsheet sync card not found"
              note_shots: [08-spreadsheet-sync.jpg]
            - wait: 0.8
            - shot: 08-spreadsheet-sync.jpg
            - block:
                shots: [09-spreadsheet-provider-picker.jpg, 10-spreadsheet-google-form.jpg]
                steps:
                  - tap_text:
                      id: settings_add_spreadsheet_destination
                      scroll: page
                    flag: picker
                  - wait: 0.6
                  - shot: 09-spreadsheet-provider-picker.jpg
                  - block:
                      shots: [10-spreadsheet-google-form.jpg]
                      steps:
                        - tap_text: settings_google_sheets
                          flag: form
                        - wait: 0.8
                        - shot: 10-spreadsheet-google-form.jpg
                  - back_if: form
                  - back_if: picker

  - group: sync
    shots:
      - 11-photo-backup.jpg
      - 12-photo-provider-picker.jpg
      - 13-photo-google-form.jpg
    steps:
      - drawer: nav_syncing
      - tap_text:
          id: settings_photo_backup
          scroll: fling
        flag: card
        note: "Photo backup card not found"
        note_shots: [11-photo-backup.jpg]
      - wait: 0.8
      - shot: 11-photo-backup.jpg
      - block:
          shots: [12-photo-provider-picker.jpg, 13-photo-google-form.jpg]
          steps:
            - tap_text:
                id: settings_add_photo_destination
                scroll: page
              flag: picker
            - wait: 0.6
            - shot: 12-photo-provider-picker.jpg
            - block:
                shots: [13-photo-google-form.jpg]
                steps:
                  - tap_text: settings_google_drive
                    flag: form
                  - wait: 0.8
                  - shot: 13-photo-google-form.jpg
            - back_if: form
            - back_if: picker

  - group: settings
    shots: [07-settings.jpg, 07b-settings-more.jpg]
    steps:
      - drawer: nav_settings
      - shot: 07-settings.jpg
      - block:
          shots: [07b-settings-more.jpg]
          steps:
            - swipe: page
            - shot: 07b-settings-more.jpg
      - back: 1

  - group: help
    shots: [14-help.jpg]
    steps:
      - drawer: nav_help
      - shot: 14-help.jpg
      - back: 1

  - group: about
    shots: [15-about.jpg]
    steps:
      - drawer: nav_about
      - shot: 15-about.jpg
      - back: 1
