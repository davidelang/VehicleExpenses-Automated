[[rule]]
decision = "allow"
priority = 950
toolName = "write_file"
argsPattern = '\\0\"file_path\":\"dev\-ai\-interaction/*\"\\0'
modes = [ "default", "autoEdit", "yolo" ]

[[rule]]
decision = "allow"
priority = 950
toolName = "run_shell_command"
