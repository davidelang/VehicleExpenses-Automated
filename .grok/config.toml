# Project-level Grok configuration (checked in).
# Merges with user ~/.grok/config.toml ; project rules take precedence for this workspace.
# Managed from orchestration root; distributed via update-rules.sh.

[permission]
rules = [
  { action = "allow", tool = "read" },
  { action = "allow", tool = "grep" },
  # narrow bash allows for safe commands (orchestration + common dev)
  # git commands - explicit list for safety (includes worktree operations needed for multi-agent)
  { action = "allow", tool = "bash", pattern = "git status*" },
  { action = "allow", tool = "bash", pattern = "git log*" },
  { action = "allow", tool = "bash", pattern = "git diff*" },
  { action = "allow", tool = "bash", pattern = "git show*" },
  { action = "allow", tool = "bash", pattern = "git add*" },
  { action = "allow", tool = "bash", pattern = "git commit*" },
  { action = "allow", tool = "bash", pattern = "git describe*" },
  { action = "allow", tool = "bash", pattern = "git rev-parse*" },
  { action = "allow", tool = "bash", pattern = "git worktree*" },
  { action = "allow", tool = "bash", pattern = "git worktree list" },
  { action = "allow", tool = "bash", pattern = "git ls-files*" },
  { action = "allow", tool = "bash", pattern = "git cat-file*" },
  { action = "allow", tool = "bash", pattern = "git rm*" },
  { action = "allow", tool = "bash", pattern = "git *" },  # fallback for other safe git usage (orchestration)
  { action = "allow", tool = "bash", pattern = "gh *" },
  { action = "allow", tool = "bash", pattern = "ls *" },
  { action = "allow", tool = "bash", pattern = "cat *" },
  { action = "allow", tool = "bash", pattern = "./build_app*" },
  { action = "allow", tool = "bash", pattern = "jq *" },

  # Blessed orchestration / launcher scripts.
  # These are trusted tools run from the orchestration root (or relatively from worktrees).
  # Explicitly allowing them here prevents repeated approval prompts when the human
  # or a trusted orchestration agent runs them.
  { action = "allow", tool = "bash", pattern = "./update-rules.sh*" },
  { action = "allow", tool = "bash", pattern = "./setup_agent.sh*" },
  { action = "allow", tool = "bash", pattern = "./sync_infrastructure.sh*" },
  # get-builds-tag.sh: safe helper for the mandatory preflight before any
  # non-HEAD git reset --hard (see AGENT_MANDATES.md). Agents should use
  #   TAG=$(./get-builds-tag.sh)
  # instead of inlining the branch/tag logic. This whitelist avoids repeated
  # per-use permission prompts for this very common safe read-only operation.
  { action = "allow", tool = "bash", pattern = "./get-builds-tag.sh*" },
  { action = "allow", tool = "bash", pattern = "../get-builds-tag.sh*" },
  # Run launchers (invoked as ./run-* from root or ../run-* from worktrees)
  { action = "allow", tool = "bash", pattern = "./run-grok*" },
  { action = "allow", tool = "bash", pattern = "./run-gemini*" },
  { action = "allow", tool = "bash", pattern = "./run-antigravity*" },
  { action = "allow", tool = "bash", pattern = "../run-grok*" },
  { action = "allow", tool = "bash", pattern = "../run-gemini*" },
  { action = "allow", tool = "bash", pattern = "../run-antigravity*" },
  # Cleanup script commonly used after agent work is merged
  { action = "allow", tool = "bash", pattern = "./remove_worktree.sh*" },
  { action = "allow", tool = "bash", pattern = "../remove_worktree.sh*" },

  # PR workflow scripts (primarily run by AI agents for generating PRs, cleanup, etc.)
  { action = "allow", tool = "bash", pattern = "./generate_pr.sh*" },
  { action = "allow", tool = "bash", pattern = "./cleanup_pr.sh*" },
  { action = "allow", tool = "bash", pattern = "../generate_pr.sh*" },
  { action = "allow", tool = "bash", pattern = "../cleanup_pr.sh*" },

  # Common safe sub-operations frequently performed by the blessed orchestration scripts
  # (mkdir, cp, rm, chmod, sed, ln are used inside update-rules, setup_agent, etc.).
  # Keeping them narrow reduces prompt noise while still being auditable.
  { action = "allow", tool = "bash", pattern = "mkdir -p *" },
  { action = "allow", tool = "bash", pattern = "cp *" },
  { action = "allow", tool = "bash", pattern = "rm -f *" },
  { action = "allow", tool = "bash", pattern = "chmod +w *" },
  { action = "allow", tool = "bash", pattern = "sed -i *" },
  { action = "allow", tool = "bash", pattern = "ln -s *" },

  # For plan mode hard stops (reinforce native plan mode via enter_plan_mode / SwitchMode):
  # deny edit/write/bash to non-sandbox paths; deny Task/subagent/invoke in plan mode, etc.
  # (exact rules tuned here + PreToolUse hooks below)
]

# Project .grok/hooks/ (PreToolUse) provide additional hard enforcement for plan-mode restrictions
# (path traversal deny outside dev-ai-interaction/, sandbox-only writes in plan, etc.).
# See .grok/hooks/ for the actual hook implementation(s).