consumer_note = "Docker NDK r28c: patches/ + patches-int8. arm64 tailor+fp16; armv7 tailor+int8 (fp32 calib, no arm82 fp16); x86 slim thin-jni+light (x86 LITE_BUILD_TAILOR drops KernelRegistrar — do not auto-tailor x86 yet). Tailor inputs (no fallback; missing = FAIL): arm64 and armv7 (both tailor by default) from ../paddle-models/artifact/tailor/{armv8,armv7} (fetch-deps build paddle-models); x86 (when tailored) from ../paddle-models/src/x86_64 (fetch-deps ro paddle-models); PADDLE_TAILOR_DIR overrides the root. get-artifacts → artifact/ only; the app reads artifact/jni and artifact/PaddlePredictor.jar directly (app/build.gradle.kts). Host opt is built by the paddle-opt pin (order paddle-opt → paddle-models → paddle)."

# --- pin-local stable names (multi-consumer / audit; independent of promote rows) ---
