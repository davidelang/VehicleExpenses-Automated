# paddle-models — non-git pin of tailor / opt inputs (.nb + lists)
# Materialize: ./third_party/fetch-deps ro paddle-models
# Layout: src/armv8|armv7|x86_64/
name = "paddle-models"
source_kind = "files"
reproducible = true
build_time = "minutes"
requires_writable_src = false
build = ["./build"]
consumer_note = "Seed keeps weights and the x86_64 tailor lists (paddle mounts src/x86_64 if x86 tailoring is turned on). Production .nb and armv8 + armv7 kernel lists are rebuilt by ./build from seed/weights and the paddle-opt pin opt (../paddle-opt/artifact/linux-x86_64/opt). Order: fetch-deps build paddle-opt → fetch-deps build paddle-models → fetch-deps build paddle. Test: tests/verify-rebuild."

