android.disallowKotlinSourceSets=false
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Daemon: DISABLED. Multi-worktree / multi-uid (ai-coder build_app vs dlang deploy).
# Agent builds do NOT re-exec as dlang — foreign-owned app/build caches break daemon reuse.
# Wrappers (build_app, deploy) also pass --no-daemon. Do not re-enable without a plan.
org.gradle.daemon=false

# Kotlin compile in-process (Gradle property, not only -D). Avoids a required
# write to ~/.local/share/kotlin/daemon (Landlock denies that path).
kotlin.compiler.execution.strategy=in-process

# Configuration cache: DISABLED. Serializes filesystem paths and file metadata that go
# stale after permission repairs (fix-perms, repair_shared_cache), causing cryptic
# "Could not stat" / "Accessing unreadable inputs or outputs" errors. Modest benefit
# (~10-20s) doesn't justify the debugging pain in this multi-worktree environment.
org.gradle.configuration-cache=false

# Build cache: DISABLED for now. Content-addressed so lower risk than config cache,
# but re-enabling one optimization at a time to isolate any regressions.
org.gradle.caching=false
