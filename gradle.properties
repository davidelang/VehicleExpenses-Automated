android.disallowKotlinSourceSets=false
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Disabled for stability in this multi-worktree / multi-group / agent-orchestration environment.
# The daemon and configuration cache are frequent sources of:
# - "Could not stat" / unreadable inputs/outputs errors after permission fixes
# - Lingering daemons that won't stop
# - Stale cache state that survives rm -rf and chmod
# - Ownership drift (ai-orchestrator / root) on cxx logs and intermediates
#
# Trade-off: builds are a bit slower on first run / after clean, but much more reliable.
# Use --no-daemon --no-configuration-cache on CLI if you ever want to override locally.
org.gradle.daemon=false
org.gradle.configuration-cache=false

# Build cache is also often problematic in this setup; keep off for consistency.
org.gradle.caching=false
