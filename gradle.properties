android.disallowKotlinSourceSets=false
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Gradle daemon JVM (must be a full JDK with javac — not a JRE-only default-java install).
# Matches app/build.gradle.kts jvmToolchain(17). Override in ~/.gradle/gradle.properties if needed.
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64

# Daemon: RE-ENABLED (2026-06-29). Safe because all gradlew invocations now run as
# uid=dlang via run-as-primary/sudo re-exec in build_app and deploy, with sg ai-shared
# group context, umask 007, and setgid dirs (2770). This structurally prevents the
# multi-user ownership drift that originally caused daemon problems.
# Per-user daemon registry (GRADLE_OPTS in build_app/deploy) keeps daemon state isolated.
# If daemon issues recur, set this to false and add --no-daemon to build_app/deploy CLI.
org.gradle.daemon=true

# Configuration cache: DISABLED. Serializes filesystem paths and file metadata that go
# stale after permission repairs (fix-perms, repair_shared_cache), causing cryptic
# "Could not stat" / "Accessing unreadable inputs or outputs" errors. Modest benefit
# (~10-20s) doesn't justify the debugging pain in this multi-worktree environment.
org.gradle.configuration-cache=false

# Build cache: DISABLED for now. Content-addressed so lower risk than config cache,
# but re-enabling one optimization at a time to isolate any regressions.
# Candidate for Phase 2 re-enablement after daemon stability is confirmed.
org.gradle.caching=false
